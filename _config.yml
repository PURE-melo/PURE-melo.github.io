# Blog Author settings
author:
  name: Guanchun Wang
  picture: /about/guanchun-wang.jpg
  email: wangguanchun@xidian.edu.cn
  description: Associate Professor at the School of Artificial Intelligence, Xidian University. Research interests include weakly supervised, multimodal and incremental learning, remote sensing image interpretation, and electromagnetic target intelligent interpretation.
  twitter:
  facebook:
  github: PURE-melo
  linkedin:
  clustrmap:


# markdown
markdown: kramdown
  
kramdown:
 footnote_nr: 1
 entity_output: as_char
 # Jekyll 3 and GitHub Pages now only support rouge for syntax highlighting
 syntax_highlighter: rouge
 syntax_highlighter_opts:
  # Use existing pygments syntax highlighting css
  css_class: 'highlight'
 span:
  line_numbers: false
 block:
  line_numbers: true
  start_line: 1
 
highlighter: rouge
    
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  
permalink: none

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      toc: true
      mathjax: true
      mermaid: false
      highlight: false
      numbering: true
      status: Completed
      protected: false
      commentable: true
      rss: true
      numbering: true

exclude:
 - LICENSE.md
 - README.md
 - "*.cdf"
 - "*.nb"
 - "*.bk"
 - "*.draft.md"
